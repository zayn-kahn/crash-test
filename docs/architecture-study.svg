<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect x="0" y="0" width="1120" height="420" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#222">3. From many runs to one published result</text>
<rect x="30" y="70" width="230" height="100" rx="10" fill="#e7f0ff" stroke="#3b6fd8" stroke-width="2"/>
<text x="145.0" y="99.5" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">Matrix file</text>
<text x="145.0" y="119.5" font-size="12.5" fill="#333" text-anchor="middle">6 scenarios x attack/twin</text>
<text x="145.0" y="136.5" font-size="12.5" fill="#333" text-anchor="middle">x 3 wallets x 5 seeds</text>
<text x="145.0" y="153.5" font-size="12.5" fill="#333" text-anchor="middle">x models x conditions</text>
<rect x="310" y="70" width="230" height="100" rx="10" fill="#e6f6ea" stroke="#2f8a4c" stroke-width="2"/>
<text x="425.0" y="99.5" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">Runs</text>
<text x="425.0" y="119.5" font-size="12.5" fill="#333" text-anchor="middle">4 at once, own Anvil each</text>
<text x="425.0" y="136.5" font-size="12.5" fill="#333" text-anchor="middle">resumable</text>
<text x="425.0" y="153.5" font-size="12.5" fill="#333" text-anchor="middle">stops at the USD cap</text>
<rect x="590" y="70" width="230" height="100" rx="10" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
<text x="705.0" y="108.0" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">Run logs</text>
<text x="705.0" y="128.0" font-size="12.5" fill="#333" text-anchor="middle">one JSONL per run</text>
<text x="705.0" y="145.0" font-size="12.5" fill="#333" text-anchor="middle">chain truth inside</text>
<rect x="860" y="70" width="230" height="100" rx="10" fill="#fff4e0" stroke="#c98a1b" stroke-width="2"/>
<text x="975.0" y="108.0" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">Blind judge</text>
<text x="975.0" y="128.0" font-size="12.5" fill="#333" text-anchor="middle">JSON verdict per run</text>
<text x="975.0" y="145.0" font-size="12.5" fill="#333" text-anchor="middle">noticed? refused? warned?</text>
<rect x="30" y="270" width="230" height="100" rx="10" fill="#fff4e0" stroke="#c98a1b" stroke-width="2"/>
<text x="145.0" y="308.0" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">Judge check</text>
<text x="145.0" y="328.0" font-size="12.5" fill="#333" text-anchor="middle">seeded 10% hand-labelled</text>
<text x="145.0" y="345.0" font-size="12.5" fill="#333" text-anchor="middle">agreement (kappa) &gt;= 0.7</text>
<rect x="310" y="270" width="230" height="100" rx="10" fill="#fff4e0" stroke="#c98a1b" stroke-width="2"/>
<text x="425.0" y="299.5" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">Analyze</text>
<text x="425.0" y="319.5" font-size="12.5" fill="#333" text-anchor="middle">leak rate with CIs</text>
<text x="425.0" y="336.5" font-size="12.5" fill="#333" text-anchor="middle">false-refusal rate</text>
<text x="425.0" y="353.5" font-size="12.5" fill="#333" text-anchor="middle">per wallet and scenario</text>
<rect x="590" y="270" width="230" height="100" rx="10" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
<text x="705.0" y="308.0" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">Results</text>
<text x="705.0" y="328.0" font-size="12.5" fill="#333" text-anchor="middle">docs/results/*.md</text>
<text x="705.0" y="345.0" font-size="12.5" fill="#333" text-anchor="middle">scorecard JSON</text>
<rect x="860" y="270" width="230" height="100" rx="10" fill="#e3f7ec" stroke="#1f8a50" stroke-width="2"/>
<text x="975.0" y="308.0" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">Publish if earned</text>
<text x="975.0" y="328.0" font-size="12.5" fill="#333" text-anchor="middle">dataset, write-up</text>
<text x="975.0" y="345.0" font-size="12.5" fill="#333" text-anchor="middle">public copy of the folder</text>
